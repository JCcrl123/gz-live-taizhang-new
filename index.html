<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>广州直播Team 数据台账</title>
<style>
:root{
  --bg:#f4f6fa; --panel:#fff; --panel2:#fafbfd; --line:#e5e9f0; --line2:#eef1f6;
  --tx:#1a2233; --tx2:#5a6478; --tx3:#8b95a8;
  --pri:#2563eb; --pri-l:#eff4ff;
  --up:#e02d3c; --down:#0e9f6e; --warn:#f59e0b;
  --c1:#2563eb; --c2:#0e9f6e; --c3:#f59e0b; --c4:#8b5cf6; --c5:#ec4899; --c6:#06b6d4;
  --sh:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --sh2:0 4px 16px rgba(16,24,40,.10);
  --r:12px;
}
[data-theme=dark]{
  --bg:#0f1420; --panel:#171e2e; --panel2:#1c2436; --line:#28324a; --line2:#222b3f;
  --tx:#e8edf7; --tx2:#9aa6bd; --tx3:#6b7791;
  --pri:#4d84ff; --pri-l:#1a2540;
  --up:#ff5c6c; --down:#22c99a;
  --sh:0 1px 3px rgba(0,0,0,.3); --sh2:0 4px 16px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ===== 密码门 ===== */
#gate{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
#gate .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px 28px;max-width:340px;width:100%;box-shadow:var(--sh2);text-align:center}
#gate h2{margin:14px 0 6px;font-size:18px}
#gate p{margin:0 0 20px;color:var(--tx2);font-size:13px}
#gate input{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--tx);text-align:center;letter-spacing:4px}
#gate button{width:100%;margin-top:12px;padding:12px;font-size:15px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer;min-height:44px}
#gate .err{color:var(--up);font-size:12px;margin-top:10px;min-height:16px}

/* ===== 布局 ===== */
.wrap{max-width:1560px;margin:0 auto;padding:0 16px 40px}
header{position:sticky;top:0;z-index:100;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.hd{max-width:1560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;white-space:nowrap}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--down);box-shadow:0 0 0 3px rgba(14,159,110,.16)}
.hd .sp{flex:1}
.sync{font-size:11px;color:var(--tx3);white-space:nowrap}
.iconbtn{width:36px;height:36px;min-width:36px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx2);padding:0}
.iconbtn:hover{background:var(--pri-l);color:var(--pri);border-color:var(--pri)}

/* 筛选栏 */
.filters{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:var(--sh)}
.fg{display:flex;align-items:center;gap:6px}
.fg label{font-size:12px;color:var(--tx2);white-space:nowrap}
input[type=date],select{padding:8px 10px;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--tx);min-height:38px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;font-size:12.5px;border:1px solid var(--line);border-radius:20px;background:var(--panel2);color:var(--tx2);cursor:pointer;white-space:nowrap;min-height:34px;display:inline-flex;align-items:center}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
.btn{padding:8px 14px;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--tx2);cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
.btn.pri:hover{opacity:.9;color:#fff}

/* Tab */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 18px;font-size:14px;font-weight:600;color:var(--tx2);cursor:pointer;border:0;background:0;border-bottom:2px solid transparent;white-space:nowrap;min-height:44px}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}
.page{display:none;padding-top:16px}
.page.on{display:block}

/* 卡片 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:14.5px;font-weight:700}
.card-h .sp{flex:1}
.card-b{padding:16px}
.sub{font-size:12px;color:var(--tx3);font-weight:400}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k,var(--pri))}
.kpi .t{font-size:11.5px;color:var(--tx2);display:flex;align-items:center;gap:5px;margin-bottom:7px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.15}
.kpi .v small{font-size:13px;font-weight:600;color:var(--tx2);margin-left:2px}
.kpi .d{font-size:11.5px;margin-top:6px;display:flex;align-items:center;gap:4px;color:var(--tx3)}
.up{color:var(--up)}.down{color:var(--down)}

/* 摘录 */
.digest{background:linear-gradient(135deg,var(--pri-l),transparent);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.digest h4{margin:0 0 9px;font-size:13px;display:flex;align-items:center;gap:7px;color:var(--pri)}
.digest ul{margin:0;padding-left:17px;font-size:13px;line-height:1.85;color:var(--tx)}
.digest b{color:var(--pri);font-weight:700}
.digest .hot{color:var(--up);font-weight:700}
.digest .good{color:var(--down);font-weight:700}

/* 预警 */
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.alert{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:10px;font-size:13px;border:1px solid;line-height:1.5}
.alert.r{background:rgba(224,45,60,.06);border-color:rgba(224,45,60,.22);color:var(--up)}
.alert.y{background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.25);color:#b45309}
.alert.g{background:rgba(14,159,110,.06);border-color:rgba(14,159,110,.2);color:var(--down)}
[data-theme=dark] .alert.y{color:#fbbf24}
.alert svg{flex-shrink:0;margin-top:1px}
.alert b{font-weight:700}

/* 网格 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mb14{margin-bottom:14px}

/* 主播卡 */
.anchors{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px}
.ac{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--sh);cursor:pointer;transition:.15s;position:relative}
.ac:hover{box-shadow:var(--sh2);transform:translateY(-2px);border-color:var(--pri)}
.ac-h{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.av{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;flex-shrink:0}
.ac-n{font-weight:700;font-size:15px}
.ac-t{font-size:11px;color:var(--tx3);margin-top:1px}
.ac-rank{position:absolute;top:13px;right:13px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--panel2);color:var(--tx3);border:1px solid var(--line)}
.ac-rank.t1{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;border:0}
.ac-rank.t2{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff;border:0}
.ac-rank.t3{background:linear-gradient(135deg,#d6a068,#b8763e);color:#fff;border:0}
.ac-g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;padding-top:12px;border-top:1px solid var(--line2)}
.ac-i .l{font-size:10.5px;color:var(--tx3);margin-bottom:3px}
.ac-i .v{font-size:15px;font-weight:700}
.ac-i .v small{font-size:10.5px;font-weight:500;color:var(--tx3)}
.prog{margin-top:11px;padding-top:11px;border-top:1px solid var(--line2)}
.prog-t{display:flex;justify-content:space-between;font-size:11px;color:var(--tx2);margin-bottom:5px}
.prog-b{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog-f{height:100%;border-radius:3px;transition:width .5s}

/* 抽屉 */
.mask{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:900;opacity:0;pointer-events:none;transition:.22s;backdrop-filter:blur(2px)}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(880px,100%);background:var(--bg);z-index:901;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;-webkit-overflow-scrolling:touch}
.drawer.on{transform:translateX(0)}
.dw-h{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;z-index:5}
.dw-h h3{margin:0;font-size:17px}
.dw-b{padding:16px 18px 40px}

/* 表格 */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 11px;font-size:11.5px;font-weight:600;color:var(--tx2);background:var(--panel2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--pri)}
td{padding:9px 11px;border-bottom:1px solid var(--line2);white-space:nowrap}
tbody tr:hover{background:var(--panel2)}
.tr{text-align:right}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;background:var(--pri-l);color:var(--pri)}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10.5px;background:var(--panel2);color:var(--tx2);border:1px solid var(--line)}

/* 热力图 */
.heat td,.heat th{text-align:center;padding:0;border:1px solid var(--panel)}
.heat .hc{padding:9px 4px;font-size:11.5px;font-weight:600;border-radius:4px;color:#fff}
.heat .rh{text-align:right;padding-right:10px;font-size:12px;color:var(--tx2);white-space:nowrap;font-weight:600;background:0;border:0}
.heat th{background:0;font-size:11px;color:var(--tx3);padding:5px 2px;position:static}

/* 图例 */
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2);margin-top:10px;justify-content:center}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

.empty{text-align:center;padding:50px 20px;color:var(--tx3);font-size:13px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--tx);color:var(--bg);padding:11px 22px;border-radius:9px;font-size:13.5px;z-index:9998;transition:.28s;opacity:0;box-shadow:var(--sh2);max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}

svg text{font-family:inherit;font-variant-numeric:tabular-nums}

@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.grid3{grid-template-columns:1fr}}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
@media(max-width:768px){
  .wrap{padding:0 11px 30px}
  .hd{padding:9px 11px;gap:9px}
  .logo{font-size:14.5px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:9px}
  .kpi{padding:12px}
  .kpi .v{font-size:20px}
  .filters{padding:11px;gap:8px}
  .fg{width:100%}
  .fg label{min-width:38px}
  input[type=date],select{flex:1;font-size:16px;min-height:42px}
  .btn,.chip{min-height:40px}
  .anchors{grid-template-columns:1fr}
  .tab{padding:11px 13px;font-size:13.5px}
  .card-b{padding:13px}
  .dw-b{padding:13px}
  table{font-size:12px}
  td,th{padding:8px 9px}
}

</style>

<header>

<div class="wrap">
  <!-- 筛选 -->
  <div class="filters">
    <div class="fg"><label>日期</label>
      <input type="date" id="d1"><span style="color:var(--tx3)">~</span><input type="date" id="d2">
    </div>
    <div class="chips" id="quickRange"></div>
    <div class="fg"><label>主播</label><select id="fAnchor"><option value="">全部</option></select></div>
    <div class="fg"><label>时段</label><select id="fSlot"><option value="">全部</option></select></div>
    <div class="sp" style="flex:1"></div>
    <button class="btn" onclick="resetFilters()">重置</button>
  </div>

  <div class="tabs">
    <button class="tab on" data-p="overview">全局概览</button>
    <button class="tab" data-p="anchor">主播分析</button>
    <button class="tab" data-p="pivot">多维透视</button>
    <button class="tab" data-p="detail">明细数据</button>
  </div>

  <!-- 全局概览 -->
  <div class="page on" id="p-overview">
    <div class="kpis" id="kpis"></div>
    <div class="alerts" id="alerts"></div>
    <div class="digest" id="digest"></div>
    <div class="card mb14">
      <div class="card-h"><h3>每日趋势</h3><span class="sub" id="trendSub"></span><div class="sp"></div>
        <div class="chips" id="trendMetric"></div>
      </div>
      <div class="card-b"><div id="trendChart"></div></div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-h"><h3>主播消耗 / 线索占比</h3></div>
        <div class="card-b"><div id="shareChart"></div></div>
      </div>
      <div class="card">
        <div class="card-h"><h3>转化漏斗</h3><span class="sub">场观 → 点击 → 留资</span></div>
        <div class="card-b"><div id="funnelChart"></div></div>
      </div>
    </div>
  </div>

  <!-- 主播分析 -->
  <div class="page" id="p-anchor">
    <div class="card mb14">
      <div class="card-h"><h3>主播效能对比</h3><span class="sub">气泡大小 = 消耗规模</span><div class="sp"></div>
        <span class="sub">横轴：小时产量（条/h）　纵轴：单线索成本（¥）</span>
      </div>
      <div class="card-b"><div id="scatterChart"></div></div>
    </div>
    <div class="card-h" style="border:0;padding:0 2px 10px"><h3>主播卡片 <span class="sub">点击查看详情</span></h3></div>
    <div class="anchors" id="anchorCards"></div>
  </div>

  <!-- 多维透视 -->
  <div class="page" id="p-pivot">
    <div class="card mb14">
      <div class="card-h"><h3>主播 × 时段 热力图</h3><div class="sp"></div><div class="chips" id="pivotMetric"></div></div>
      <div class="card-b"><div id="heatChart"></div></div>
    </div>
    <div class="grid2 mb14">
      <div class="card"><div class="card-h"><h3>星期规律</h3></div><div class="card-b"><div id="wdChart"></div></div></div>
      <div class="card"><div class="card-h"><h3>场次属性分布</h3></div><div class="card-b"><div id="slotChart"></div></div></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>月度汇总</h3></div>
      <div class="card-b" style="padding:0"><div class="tw"><table id="monthTable"></table></div></div>
    </div>
  </div>

  <!-- 明细 -->
  <div class="page" id="p-detail">
    <div class="card">
      <div class="card-h"><h3>场次明细</h3><span class="sub" id="detailCount"></span><div class="sp"></div>
        <button class="btn" onclick="doExport()">导出 CSV</button>
      </div>
      <div class="card-b" style="padding:0"><div class="tw" style="max-height:72vh"><table id="detailTable"></table></div></div>
    </div>
  </div>
</div>

    <button class="iconbtn" onclick="closeDrawer()">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h3 id="dwTitle"></h3>
  </div>
  <div class="dw-b" id="dwBody"></div>
</div>

<div class="toast" id="toast"></div>


<script>
/* ==================== 常量 ==================== */

var PAL = ['#2563eb','#0e9f6e','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#ef4444','#84cc16','#f97316','#14b8a6','#a855f7','#3b82f6'];
var BUCKETS = ['早间 06-10','午间 10-14','下午 14-18','晚间 18-22','深夜 22-06'];
var WD = ['周一','周二','周三','周四','周五','周六','周日'];
var DATA = null, SESS = [], VIEW = [];
var state = { d1:'', d2:'', anchor:'', slot:'', trend:'leads', pivot:'lph', sortKey:'date', sortDesc:true };

/* ==================== 工具 ==================== */
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(n,d){ if(n==null||isNaN(n))return '—'; d=d==null?0:d; return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtK(n){ if(n==null||isNaN(n))return '—'; var a=Math.abs(n); if(a>=1e8)return (n/1e8).toFixed(2)+'亿'; if(a>=1e4)return (n/1e4).toFixed(1)+'万'; return fmt(n,0); }
function pct(n,d){ if(n==null||isNaN(n))return '—'; return (n*100).toFixed(d==null?1:d)+'%'; }
function div(a,b){ return (b&&b>0&&a!=null)?a/b:null; }
function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},2200); }
function colorOf(name){ var h=0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0; return PAL[h%PAL.length]; }
function svgEl(vb,h){ return '<svg viewBox="'+vb+'" style="width:100%;height:'+h+'px;display:block" preserveAspectRatio="xMidYMid meet">'; }



/* ==================== 主题 ==================== */
function toggleTheme(){
  var d = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', d?'light':'dark');
  try{ localStorage.setItem('gz_theme', d?'light':'dark'); }catch(e){}
  if(DATA) renderAll();
}
try{ if(localStorage.getItem('gz_theme')==='dark') document.documentElement.setAttribute('data-theme','dark'); }catch(e){}

/* ==================== 指标计算 ==================== */
function agg(list){
  var o = { n:list.length, cost:0, leads:0, billH:0, views:0, clicks:0, comments:0, vN:0, cN:0, mN:0 };
  for(var i=0;i<list.length;i++){
    var s=list[i];
    o.cost += s.c||0;
    o.leads += s.l||0;
    o.billH += s.b||0;
    if(s.v!=null){ o.views+=s.v; o.vN++; }
    if(s.k!=null){ o.clicks+=s.k; o.cN++; }
    if(s.o!=null){ o.comments+=s.o; o.mN++; }
  }
  o.cpl  = div(o.cost, o.leads);            // 单线索成本
  o.lph  = div(o.leads, o.billH);           // 小时产量
  o.cph  = div(o.cost, o.billH);            // 小时消耗
  o.ctr  = o.vN?div(o.clicks, o.views):null;      // 小风车点击率
  o.cvr  = o.cN?div(o.leads, o.clicks):null;      // 小风车留资转化率
  o.mvr  = o.mN?div(o.leads, o.comments):null;    // 评论留资转化率
  o.lps  = div(o.leads, o.n);               // 场均留资
  return o;
}

/* ==================== 筛选 ==================== */
function applyFilter(){
  VIEW = SESS.filter(function(s){
    if(state.d1 && s.d < state.d1) return false;
    if(state.d2 && s.d > state.d2) return false;
    if(state.anchor && s.a !== state.anchor) return false;
    if(state.slot && s.p !== state.slot) return false;
    return true;
  });
}
function prevPeriod(){
  if(!state.d1||!state.d2) return [];
  var a=new Date(state.d1), b=new Date(state.d2);
  var days=Math.round((b-a)/864e5)+1;
  var pb=new Date(a.getTime()-864e5), pa=new Date(pb.getTime()-(days-1)*864e5);
  var f=function(d){ return d.toISOString().slice(0,10); };
  var s1=f(pa), s2=f(pb);
  return SESS.filter(function(s){
    if(s.d<s1||s.d>s2) return false;
    if(state.anchor&&s.a!==state.anchor) return false;
    if(state.slot&&s.p!==state.slot) return false;
    return true;
  });
}
function setRange(days){
  var max = DATA.meta.dateMax;
  var b = new Date(max);
  var a = new Date(b.getTime()-(days-1)*864e5);
  state.d1 = a.toISOString().slice(0,10);
  state.d2 = max;
  $('#d1').value=state.d1; $('#d2').value=state.d2;
  renderAll();
}
function resetFilters(){
  state.anchor=''; state.slot='';
  $('#fAnchor').value=''; $('#fSlot').value='';
  setRange(90);
}

/* ==================== KPI ==================== */
var KPI_DEF = [
  { k:'cost',  t:'总消耗',        c:'--c1', f:function(o){ return '¥'+fmtK(o.cost); },  rev:true },
  { k:'leads', t:'总线索量',      c:'--c2', f:function(o){ return fmt(o.leads); } },
  { k:'cpl',   t:'单线索成本',    c:'--c3', f:function(o){ return o.cpl==null?'—':'¥'+fmt(o.cpl,0); }, rev:true },
  { k:'ctr',   t:'小风车点击率',  c:'--c4', f:function(o){ return pct(o.ctr,2); } },
  { k:'cvr',   t:'小风车留资转化',c:'--c5', f:function(o){ return pct(o.cvr,1); } },
  { k:'mvr',   t:'评论留资转化',  c:'--c6', f:function(o){ return pct(o.mvr,1); } }
];
function renderKPI(){
  var cur=agg(VIEW), pre=agg(prevPeriod());
  var h='';
  for(var i=0;i<KPI_DEF.length;i++){
    var d=KPI_DEF[i], a=cur[d.k], b=pre[d.k], delta='';
    if(a!=null && b!=null && b!==0){
      var ch=(a-b)/Math.abs(b);
      var good = d.rev ? ch<0 : ch>0;
      var arrow = ch>0
        ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 15 12 9 18 15"/></svg>'
        : '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"/></svg>';
      delta='<div class="d '+(good?'down':'up')+'">'+arrow+Math.abs(ch*100).toFixed(1)+'% <span style="color:var(--tx3)">较上期</span></div>';
    } else {
      delta='<div class="d">上期无数据</div>';
    }
    h+='<div class="kpi" style="--k:var('+d.c+')"><div class="t">'+d.t+'</div><div class="v num">'+d.f(cur)+'</div>'+delta+'</div>';
  }
  $('#kpis').innerHTML=h;
}

/* ==================== 预警 ==================== */
function renderAlerts(){
  var o=agg(VIEW);
  var byA={};
  VIEW.forEach(function(s){ (byA[s.a]=byA[s.a]||[]).push(s); });
  var rows=[];
  for(var k in byA){
    var a=agg(byA[k]);
    if(a.n>=3) rows.push({name:k,a:a});
  }
  var teamCpl=o.cpl, teamLph=o.lph;
  var out=[];
  var ico={
    r:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    y:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
    g:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
  };
  // 成本超标
  if(teamCpl){
    rows.forEach(function(r){
      if(r.a.cpl==null) return;
      var d=(r.a.cpl-teamCpl)/teamCpl;
      if(d>=0.5) out.push({t:'r',h:'<b>'+esc(r.name)+'</b> 单线索成本 ¥'+fmt(r.a.cpl,0)+'，高于团队均值 <b>'+(d*100).toFixed(0)+'%</b>（团队 ¥'+fmt(teamCpl,0)+'，'+r.a.n+' 场）'});
      else if(d>=0.2) out.push({t:'y',h:'<b>'+esc(r.name)+'</b> 单线索成本 ¥'+fmt(r.a.cpl,0)+'，高于团队均值 '+(d*100).toFixed(0)+'%'});
    });
  }
  // 产量优异
  if(teamLph){
    rows.forEach(function(r){
      if(r.a.lph==null) return;
      var d=(r.a.lph-teamLph)/teamLph;
      if(d>=0.3) out.push({t:'g',h:'<b>'+esc(r.name)+'</b> 小时产量 '+fmt(r.a.lph,2)+' 条/h，高于团队均值 <b>'+(d*100).toFixed(0)+'%</b>，可复制其打法'});
    });
  }
  // 零线索场次
  var zero=VIEW.filter(function(s){ return s.l===0 && s.c>200; });
  if(zero.length) out.push({t:'y',h:'有 <b>'+zero.length+'</b> 场消耗 &gt;¥200 但零线索，累计浪费 <b>¥'+fmtK(zero.reduce(function(a,b){return a+b.cost;},0))+'</b>'});

  out.sort(function(a,b){ return ({r:0,y:1,g:2})[a.t]-({r:0,y:1,g:2})[b.t]; });
  out=out.slice(0,6);
  $('#alerts').innerHTML = out.length
    ? out.map(function(x){ return '<div class="alert '+x.t+'">'+ico[x.t]+'<div>'+x.h+'</div></div>'; }).join('')
    : '<div class="alert g">'+ico.g+'<div>当前筛选范围内未发现明显异常</div></div>';
}

/* ==================== 数据摘录 ==================== */
function renderDigest(){
  var o=agg(VIEW);
  if(!VIEW.length){ $('#digest').innerHTML='<h4>数据摘录</h4><ul><li>当前范围无数据</li></ul>'; return; }
  var byA={}; VIEW.forEach(function(s){ (byA[s.a]=byA[s.a]||[]).push(s); });
  var arr=[]; for(var k in byA){ var a=agg(byA[k]); if(a.n>=2) arr.push({name:k,a:a}); }

  var topLeads=arr.slice().sort(function(x,y){ return y.a.leads-x.a.leads; })[0];
  var bestLph =arr.filter(function(x){return x.a.lph!=null;}).sort(function(x,y){ return y.a.lph-x.a.lph; })[0];
  var bestCpl =arr.filter(function(x){return x.a.cpl!=null;}).sort(function(x,y){ return x.a.cpl-y.a.cpl; })[0];

  var byB={}; VIEW.forEach(function(s){ (byB[s.u]=byB[s.u]||[]).push(s); });
  var bArr=[]; for(var b in byB){ var ba=agg(byB[b]); if(ba.n>=3) bArr.push({name:b,a:ba}); }
  var bestB=bArr.filter(function(x){return x.a.lph!=null;}).sort(function(x,y){ return y.a.lph-x.a.lph; })[0];

  var byD={}; VIEW.forEach(function(s){ byD[s.d]=(byD[s.d]||0)+(s.l||0); });
  var dk=Object.keys(byD).sort(function(a,b){ return byD[b]-byD[a]; });
  var days=Object.keys(byD).length;

  var li=[];
  li.push('区间内共 <b>'+fmt(o.n)+'</b> 场直播，覆盖 <b>'+days+'</b> 天，'+
          '总消耗 <b>¥'+fmtK(o.cost)+'</b>，收获线索 <b>'+fmt(o.leads)+'</b> 条，'+
          '综合单线索成本 <b>¥'+fmt(o.cpl,0)+'</b>');
  li.push('累计计费 <b>'+fmt(o.billH,1)+'</b> 小时，团队平均小时产量 <b>'+fmt(o.lph,2)+'</b> 条/h，'+
          '小时消耗 <b>¥'+fmt(o.cph,0)+'</b>/h');
  if(topLeads) li.push('线索贡献冠军：<span class="good">'+esc(topLeads.name)+'</span> '+fmt(topLeads.a.leads)+' 条'+
          '（占全队 '+pct(div(topLeads.a.leads,o.leads))+'，'+topLeads.a.n+' 场）');
  if(bestLph) li.push('产能最强：<span class="good">'+esc(bestLph.name)+'</span> '+fmt(bestLph.a.lph,2)+' 条/h'+
          (bestCpl?('　｜　成本最优：<span class="good">'+esc(bestCpl.name)+'</span> ¥'+fmt(bestCpl.a.cpl,0)+'/条'):''));
  if(bestB) li.push('最佳开播时段：<b>'+esc(bestB.name)+'</b>，小时产量 '+fmt(bestB.a.lph,2)+' 条/h，'+
          '单线索成本 ¥'+fmt(bestB.a.cpl,0)+'（'+bestB.a.n+' 场）');
  if(dk.length) li.push('单日峰值：<b>'+dk[0]+'</b> 收获 '+fmt(byD[dk[0]])+' 条线索');
  if(o.ctr!=null) li.push('转化链路：小风车点击率 <b>'+pct(o.ctr,2)+'</b> → 点击留资转化 <b>'+pct(o.cvr,1)+'</b>，'+
          '评论留资转化 <b>'+pct(o.mvr,1)+'</b>');

  $('#digest').innerHTML='<h4><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>数据摘录</h4><ul>'+li.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
}

/* ==================== 趋势图 ==================== */
var TREND_M=[
  {k:'leads',t:'线索量',f:function(o){return o.leads;},fmt:function(v){return fmt(v);}},
  {k:'cost',t:'消耗',f:function(o){return o.cost;},fmt:function(v){return '¥'+fmtK(v);}},
  {k:'cpl',t:'单线索成本',f:function(o){return o.cpl;},fmt:function(v){return v==null?'—':'¥'+fmt(v,0);}},
  {k:'lph',t:'小时产量',f:function(o){return o.lph;},fmt:function(v){return v==null?'—':fmt(v,2);}}
];
function renderTrend(){
  var byD={};
  VIEW.forEach(function(s){ (byD[s.d]=byD[s.d]||[]).push(s); });
  var dates=Object.keys(byD).sort();
  var m=TREND_M.filter(function(x){return x.k===state.trend;})[0];
  $('#trendSub').textContent = dates.length? (dates.length+' 天'):'';

  if(dates.length<2){ $('#trendChart').innerHTML='<div class="empty">数据不足，无法绘制趋势</div>'; return; }
  // 超过 90 天按周聚合
  var agK=[], agV=[], mode='日';
  if(dates.length>92){
    mode='周';
    var wk={};
    dates.forEach(function(d){
      var dt=new Date(d), day=(dt.getDay()+6)%7;
      var mon=new Date(dt.getTime()-day*864e5).toISOString().slice(0,10);
      (wk[mon]=wk[mon]||[]).push.apply(wk[mon], byD[d]);
    });
    agK=Object.keys(wk).sort(); agK.forEach(function(k){ agV.push(m.f(agg(wk[k]))); });
  } else {
    agK=dates; dates.forEach(function(d){ agV.push(m.f(agg(byD[d]))); });
  }
  var W=1000,H=300,pl=62,pr=18,pt=18,pb=42;
  var iw=W-pl-pr, ih=H-pt-pb;
  var valid=agV.filter(function(v){return v!=null;});
  if(!valid.length){ $('#trendChart').innerHTML='<div class="empty">该指标在当前范围内无有效数据</div>'; return; }
  var mx=Math.max.apply(null,valid), mn=Math.min.apply(null,valid);
  if(mx===mn){ mx=mx*1.2+1; mn=Math.max(0,mn*0.8-1); }
  var pad=(mx-mn)*0.12; mx+=pad; mn=Math.max(0,mn-pad);
  var X=function(i){ return pl+(agK.length<2?iw/2:i*iw/(agK.length-1)); };
  var Y=function(v){ return pt+ih-((v-mn)/(mx-mn))*ih; };

  var g='';
  for(var i=0;i<=4;i++){
    var y=pt+ih*i/4, v=mx-(mx-mn)*i/4;
    g+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"'+(i<4?' stroke-dasharray="3 4"':'')+'/>';
    g+='<text x="'+(pl-9)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--tx3)">'+m.fmt(v).replace('¥','')+'</text>';
  }
  // 折线（跳过 null）
  var segs=[], cur=[];
  agV.forEach(function(v,i){ if(v==null){ if(cur.length)segs.push(cur); cur=[]; } else cur.push([X(i),Y(v)]); });
  if(cur.length) segs.push(cur);
  var path=segs.map(function(sg){ return 'M'+sg.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join('L'); }).join(' ');
  var area='';
  if(segs.length===1&&segs[0].length>1){
    var sg=segs[0];
    area='<path d="M'+sg.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join('L')+'L'+sg[sg.length-1][0].toFixed(1)+' '+(pt+ih)+'L'+sg[0][0].toFixed(1)+' '+(pt+ih)+'Z" fill="url(#tg)"/>';
  }
  var dots='';
  var step=Math.max(1,Math.ceil(agK.length/60));
  agV.forEach(function(v,i){
    if(v==null||i%step) return;
    dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.8" fill="var(--panel)" stroke="var(--pri)" stroke-width="2"><title>'+agK[i]+'　'+m.t+'：'+m.fmt(v)+'</title></circle>';
  });
  var lb='', ls=Math.max(1,Math.ceil(agK.length/9));
  agK.forEach(function(k,i){
    if(i%ls && i!==agK.length-1) return;
    lb+='<text x="'+X(i).toFixed(1)+'" y="'+(H-16)+'" text-anchor="middle" font-size="11" fill="var(--tx3)">'+k.slice(5)+'</text>';
  });
  $('#trendChart').innerHTML = svgEl('0 0 '+W+' '+H,320)+
    '<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--pri)" stop-opacity=".22"/><stop offset="1" stop-color="var(--pri)" stop-opacity="0"/></linearGradient></defs>'+
    g+area+'<path d="'+path+'" fill="none" stroke="var(--pri)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+dots+lb+
    '<text x="'+(W-pr)+'" y="'+(H-3)+'" text-anchor="end" font-size="10" fill="var(--tx3)">按'+mode+'聚合</text></svg>';
}

/* ==================== 占比图 ==================== */
function renderShare(){
  var byA={}; VIEW.forEach(function(s){ (byA[s.a]=byA[s.a]||[]).push(s); });
  var arr=[]; for(var k in byA){ var a=agg(byA[k]); arr.push({name:k,cost:a.cost,leads:a.leads,cpl:a.cpl}); }
  arr.sort(function(x,y){ return y.cost-x.cost; });
  if(arr.length>8){
    var rest=arr.slice(7), o={name:'其他 '+rest.length+' 人',cost:0,leads:0};
    rest.forEach(function(r){ o.cost+=r.cost; o.leads+=r.leads; });
    o.cpl=div(o.cost,o.leads); arr=arr.slice(0,7).concat([o]);
  }
  if(!arr.length){ $('#shareChart').innerHTML='<div class="empty">无数据</div>'; return; }
  var tc=arr.reduce(function(a,b){return a+b.cost;},0);
  var tl=arr.reduce(function(a,b){return a+b.leads;},0);
  var W=1000,H=Math.max(150,arr.length*44+24),bw=W-250;
  var h='';
  arr.forEach(function(r,i){
    var y=i*44+10, c=colorOf(r.name);
    var wc=tc?Math.max(2,r.cost/tc*bw*0.9):0;
    var wl=tl?Math.max(2,r.leads/tl*bw*0.9):0;
    h+='<text x="0" y="'+(y+13)+'" font-size="12.5" font-weight="600" fill="var(--tx)">'+esc(r.name)+'</text>';
    h+='<text x="0" y="'+(y+30)+'" font-size="10.5" fill="var(--tx3)">¥'+fmt(r.cpl,0)+'/条</text>';
    h+='<rect x="105" y="'+(y+1)+'" width="'+wc.toFixed(1)+'" height="14" rx="3" fill="'+c+'" opacity=".82"><title>消耗 ¥'+fmt(r.cost,0)+'（'+pct(div(r.cost,tc))+'）</title></rect>';

/* ==================== 散点 ==================== */
function renderScatter(){
  var byA={}; VIEW.forEach(function(s){ (byA[s.a]=byA[s.a]||[]).push(s); });
  var arr=[]; for(var k in byA){ var a=agg(byA[k]); if(a.n>=3&&a.lph!=null&&a.cpl!=null) arr.push({name:k,a:a}); }
  if(arr.length<2){ $('#scatterChart').innerHTML='<div class="empty">有效主播不足（需 ≥3 场记录）</div>'; return; }
  var W=1000,H=380,pl=70,pr=26,pt=22,pb=48, iw=W-pl-pr, ih=H-pt-pb;
  var xs=arr.map(function(r){return r.a.lph;}), ys=arr.map(function(r){return r.a.cpl;});
  var x1=0, x2=Math.max.apply(null,xs)*1.18;
  var y1=0, y2=Math.max.apply(null,ys)*1.18;
  var X=function(v){ return pl+(v-x1)/(x2-x1)*iw; };
  var Y=function(v){ return pt+ih-(v-y1)/(y2-y1)*ih; };
  var team=agg(VIEW), mc=Math.max.apply(null,arr.map(function(r){return r.a.cost;}));

  var g='';
  for(var i=0;i<=4;i++){
    var y=pt+ih*i/4, v=y2-(y2-y1)*i/4;
    g+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-dasharray="3 4"/>';
    g+='<text x="'+(pl-9)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--tx3)">¥'+fmt(v,0)+'</text>';
    var x=pl+iw*i/4, xv=x1+(x2-x1)*i/4;
    g+='<text x="'+x.toFixed(1)+'" y="'+(H-20)+'" text-anchor="middle" font-size="11" fill="var(--tx3)">'+fmt(xv,2)+'</text>';
  }
  // 均值参考线
  if(team.lph!=null&&team.lph<x2) g+='<line x1="'+X(team.lph).toFixed(1)+'" y1="'+pt+'" x2="'+X(team.lph).toFixed(1)+'" y2="'+(pt+ih)+'" stroke="var(--warn)" stroke-width="1.4" stroke-dasharray="5 4"/><text x="'+(X(team.lph)+5).toFixed(1)+'" y="'+(pt+12)+'" font-size="10.5" fill="var(--warn)">团队均值</text>';
  if(team.cpl!=null&&team.cpl<y2) g+='<line x1="'+pl+'" y1="'+Y(team.cpl).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Y(team.cpl).toFixed(1)+'" stroke="var(--warn)" stroke-width="1.4" stroke-dasharray="5 4"/>';

  var pts='';
  arr.sort(function(a,b){ return b.a.cost-a.a.cost; });
  arr.forEach(function(r){
    var cx=X(r.a.lph), cy=Y(r.a.cpl), rr=9+Math.sqrt(r.a.cost/mc)*17, c=colorOf(r.name);
    pts+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+rr.toFixed(1)+'" fill="'+c+'" opacity=".26"/>';
    pts+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4.5" fill="'+c+'"><title>'+esc(r.name)+'\\n小时产量 '+fmt(r.a.lph,2)+' 条/h\\n单线索成本 ¥'+fmt(r.a.cpl,0)+'\\n消耗 ¥'+fmtK(r.a.cost)+'\\n'+r.a.n+' 场</title></circle>';
    pts+='<text x="'+cx.toFixed(1)+'" y="'+(cy-rr-5).toFixed(1)+'" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--tx)">'+esc(r.name)+'</text>';
  });
  $('#scatterChart').innerHTML = svgEl('0 0 '+W+' '+H,370)+g+pts+
    '<text x="'+(W-pr)+'" y="'+(H-4)+'" text-anchor="end" font-size="10.5" fill="var(--tx3)">← 左上象限：高成本低产能（需优化）　右下象限：高产能低成本（标杆）</text></svg>';
}

/* ==================== 主播卡片 ==================== */
function renderAnchorCards(){
  var byA={}; VIEW.forEach(function(s){ (byA[s.a]=byA[s.a]||[]).push(s); });
  var arr=[]; for(var k in byA) arr.push({name:k,list:byA[k],a:agg(byA[k])});
  arr.sort(function(x,y){ return y.a.leads-x.a.leads; });
  if(!arr.length){ $('#anchorCards').innerHTML='<div class="empty">无数据</div>'; return; }

  // 当月目标
  var ym = (state.d2||DATA.meta.dateMax).slice(0,7);
  var tg = (DATA.targets&&DATA.targets[ym])||{};
  var team=agg(VIEW);

  $('#anchorCards').innerHTML = arr.map(function(r,i){
    var c=colorOf(r.name), a=r.a;
    var rank = i<3 ? '<div class="ac-rank t'+(i+1)+'">NO.'+(i+1)+'</div>' : '<div class="ac-rank">NO.'+(i+1)+'</div>';
    var cplCls='';
    if(a.cpl!=null&&team.cpl){
      var d=(a.cpl-team.cpl)/team.cpl;
      cplCls = d>=0.2?'style="color:var(--up)"':(d<=-0.2?'style="color:var(--down)"':'');
    }
    var prog='';
    var t=tg[r.name];
    if(t){
      // 当月实际
      var mLeads=SESS.filter(function(s){ return s.a===r.name && s.y===ym; }).reduce(function(x,y){return x+(y.leads||0);},0);
      var p=Math.min(100,mLeads/t*100);
      var pc = p>=100?'var(--down)':(p>=70?'var(--pri)':(p>=40?'var(--warn)':'var(--up)'));
      prog='<div class="prog"><div class="prog-t"><span>'+ym+' 月度目标</span><span class="num" style="font-weight:700;color:'+pc+'">'+fmt(mLeads)+' / '+fmt(t)+'　'+p.toFixed(0)+'%</span></div>'+
           '<div class="prog-b"><div class="prog-f" style="width:'+p+'%;background:'+pc+'"></div></div></div>';
    }
    return '<div class="ac" onclick="openAnchor(&#39;'+encodeURIComponent(r.name)+'&#39;)">'+rank+
      '<div class="ac-h"><div class="av" style="background:'+c+'">'+esc(r.name.slice(0,1))+'</div>'+
      '<div><div class="ac-n">'+esc(r.name)+'</div><div class="ac-t">'+esc(r.list[0].atype)+' · '+a.n+' 场 · '+fmt(a.billH,1)+'h</div></div></div>'+
      '<div class="ac-g">'+
        '<div class="ac-i"><div class="l">线索量</div><div class="v num">'+fmt(a.leads)+'</div></div>'+
        '<div class="ac-i"><div class="l">小时产量</div><div class="v num">'+fmt(a.lph,2)+'<small> 条/h</small></div></div>'+
        '<div class="ac-i"><div class="l">单线索成本</div><div class="v num" '+cplCls+'>'+(a.cpl==null?'—':'¥'+fmt(a.cpl,0))+'</div></div>'+
        '<div class="ac-i"><div class="l">总消耗</div><div class="v num">¥'+fmtK(a.cost)+'</div></div>'+
        '<div class="ac-i"><div class="l">小时消耗</div><div class="v num">¥'+fmt(a.cph,0)+'</div></div>'+
        '<div class="ac-i"><div class="l">场均留资</div><div class="v num">'+fmt(a.lps,1)+'</div></div>'+
      '</div>'+prog+'</div>';
  }).join('');
}

/* ==================== 主播详情抽屉 ==================== */
function openAnchor(enc){
  var name=decodeURIComponent(enc);
  var list=VIEW.filter(function(s){ return s.a===name; });
  var a=agg(list), team=agg(VIEW), c=colorOf(name);
  $('#dwTitle').innerHTML='<span style="display:inline-flex;align-items:center;gap:9px"><span class="av" style="background:'+c+';width:30px;height:30px;font-size:13px;border-radius:8px">'+esc(name.slice(0,1))+'</span>'+esc(name)+'</span>';

  var h='';
  // KPI
  var ks=[
    ['场次',fmt(a.n)],['计费小时',fmt(a.billH,1)+'h'],['总消耗','¥'+fmtK(a.cost)],
    ['线索量',fmt(a.leads)],['单线索成本',a.cpl==null?'—':'¥'+fmt(a.cpl,0)],['小时产量',fmt(a.lph,2)+' 条/h'],
    ['小时消耗','¥'+fmt(a.cph,0)],['场均留资',fmt(a.lps,1)],['小风车点击率',pct(a.ctr,2)],
    ['小风车留资转化',pct(a.cvr,1)],['评论留资转化',pct(a.mvr,1)],['场均时长',fmt(div(a.billH,a.n),2)+'h']
  ];
  h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;margin-bottom:16px">'+
     ks.map(function(k){ return '<div class="card" style="padding:11px 12px"><div style="font-size:10.5px;color:var(--tx3);margin-bottom:4px">'+k[0]+'</div><div class="num" style="font-size:16px;font-weight:700">'+k[1]+'</div></div>'; }).join('')+'</div>';

  // 与团队对比
  var cmp=[
    ['小时产量',a.lph,team.lph,false,2,''],
    ['单线索成本',a.cpl,team.cpl,true,0,'¥'],
    ['小风车点击率',a.ctr,team.ctr,false,4,'%'],
    ['小风车留资转化',a.cvr,team.cvr,false,3,'%'],
    ['评论留资转化',a.mvr,team.mvr,false,3,'%']
  ];
  h+='<div class="card mb14"><div class="card-h"><h3>对比团队均值</h3></div><div class="card-b" style="padding:14px 16px">';
  cmp.forEach(function(x){
    if(x[1]==null||x[2]==null||x[2]===0) return;
    var d=(x[1]-x[2])/x[2], good = x[3]? d<0 : d>0;
    var w=Math.min(100,Math.abs(d)*100);
    var vs = x[5]==='%' ? pct(x[1],2) : (x[5]+fmt(x[1],x[4]));
    var ts = x[5]==='%' ? pct(x[2],2) : (x[5]+fmt(x[2],x[4]));
    h+='<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">'+
       '<span>'+x[0]+'　<b class="num">'+vs+'</b> <span style="color:var(--tx3)">vs 团队 '+ts+'</span></span>'+
       '<b class="num '+(good?'down':'up')+'">'+(d>0?'+':'')+(d*100).toFixed(1)+'%</b></div>'+
       '<div class="prog-b"><div class="prog-f" style="width:'+w+'%;background:var(--'+(good?'down':'up')+')"></div></div></div>';
  });
  h+='</div></div>';

  // 时段分布
  var byB={}; list.forEach(function(s){ (byB[s.u]=byB[s.u]||[]).push(s); });
  var bs=BUCKETS.filter(function(b){ return byB[b]; });
  if(bs.length){
    var mxL=Math.max.apply(null,bs.map(function(b){ return agg(byB[b]).lph||0; }));
    h+='<div class="card mb14"><div class="card-h"><h3>时段表现</h3><span class="sub">柱长 = 小时产量</span></div><div class="card-b" style="padding:14px 16px">';
    bs.forEach(function(b){
      var ba=agg(byB[b]), w=mxL?Math.max(3,(ba.lph||0)/mxL*100):0;
      h+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">'+
         '<span><b>'+b+'</b> <span style="color:var(--tx3)">'+ba.n+' 场</span></span>'+
         '<span class="num">'+fmt(ba.lph,2)+' 条/h　¥'+fmt(ba.cpl,0)+'/条</span></div>'+
         '<div class="prog-b" style="height:8px"><div class="prog-f" style="width:'+w+'%;background:'+c+'"></div></div></div>';
    });
    h+='</div></div>';
  }

  // 场次明细
  var sl=list.slice().sort(function(x,y){ return x.date<y.date?1:-1; }).slice(0,80);
  h+='<div class="card"><div class="card-h"><h3>场次明细</h3><span class="sub">最近 '+sl.length+' 场</span></div>'+
     '<div class="card-b" style="padding:0"><div class="tw" style="max-height:420px"><table><thead><tr>'+
     '<th>日期</th><th>时段</th><th>时长</th><th class="tr">消耗</th><th class="tr">线索</th><th class="tr">成本</th><th class="tr">产量</th><th class="tr">场观</th></tr></thead><tbody>'+
     sl.map(function(s){
       var cpl=div(s.c,s.l), lph=div(s.l,s.b);
       var hl = (s.l===0&&s.c>200)?' style="color:var(--up);font-weight:600"':'';
       return '<tr><td>'+s.d.slice(5)+'</td><td><span class="tag">'+esc(s.s||'')+'-'+esc(s.e||'')+'</span></td>'+
         '<td class="num">'+fmt(s.b,1)+'h</td><td class="tr num">¥'+fmt(s.c,0)+'</td>'+
         '<td class="tr num"'+hl+'>'+fmt(s.l)+'</td><td class="tr num">'+(cpl==null?'—':'¥'+fmt(cpl,0))+'</td>'+
         '<td class="tr num">'+(lph==null?'—':fmt(lph,2))+'</td><td class="tr num">'+(s.v==null?'—':fmt(s.v))+'</td></tr>';
     }).join('')+'</tbody></table></div></div></div>';

  $('#dwBody').innerHTML=h;
  $('#mask').classList.add('on'); $('#drawer').classList.add('on');
  document.body.style.overflow='hidden';
}

  $('#mask').classList.remove('on'); $('#drawer').classList.remove('on');
  document.body.style.overflow='';

/* ==================== 热力图 ==================== */
var PIVOT_M=[
  {k:'lph',t:'小时产量',f:function(o){return o.lph;},fmt:function(v){return fmt(v,2);},rev:false},
  {k:'cpl',t:'单线索成本',f:function(o){return o.cpl;},fmt:function(v){return '¥'+fmt(v,0);},rev:true},
  {k:'leads',t:'线索量',f:function(o){return o.leads;},fmt:function(v){return fmt(v);},rev:false},
  {k:'cost',t:'消耗',f:function(o){return o.cost;},fmt:function(v){return fmtK(v);},rev:true}
];
function renderHeat(){
  var m=PIVOT_M.filter(function(x){return x.k===state.pivot;})[0];
  var byA={}; VIEW.forEach(function(s){ (byA[s.a]=byA[s.a]||[]).push(s); });
  var names=Object.keys(byA).filter(function(k){ return byA[k].length>=3; })
    .sort(function(x,y){ return agg(byA[y]).leads-agg(byA[x]).leads; }).slice(0,14);
  if(!names.length){ $('#heatChart').innerHTML='<div class="empty">数据不足</div>'; return; }

  var cells={}, vals=[];
  names.forEach(function(n){
    cells[n]={};
    BUCKETS.forEach(function(b){
      var sub=byA[n].filter(function(s){ return s.u===b; });
      if(!sub.length) return;
      var v=m.f(agg(sub));
      if(v!=null){ cells[n][b]={v:v,n:sub.length}; vals.push(v); }
    });
  });
  if(!vals.length){ $('#heatChart').innerHTML='<div class="empty">该指标无有效数据</div>'; return; }
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  var col=function(v){
    var t=mx===mn?0.5:(v-mn)/(mx-mn);
    if(m.rev) t=1-t;
    // 红 → 黄 → 绿
    var r,g,b;
    if(t<0.5){ var k=t*2; r=224+(245-224)*k; g=45+(158-45)*k; b=60+(11-60)*k; }
    else { var k2=(t-0.5)*2; r=245+(14-245)*k2; g=158+(159-158)*k2; b=11+(110-11)*k2; }
    return 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';
  };
  var h='<table class="heat"><thead><tr><th style="width:88px"></th>'+
    BUCKETS.map(function(b){ return '<th>'+b+'</th>'; }).join('')+'<th style="width:62px">合计</th></tr></thead><tbody>';
  names.forEach(function(n){
    h+='<tr><td class="rh">'+esc(n)+'</td>';
    BUCKETS.forEach(function(b){
      var c=cells[n][b];
      h+= c ? '<td><div class="hc" style="background:'+col(c.v)+'" title="'+esc(n)+' · '+b+'\\n'+m.t+'：'+m.fmt(c.v)+'\\n'+c.n+' 场">'+m.fmt(c.v)+'</div></td>'
            : '<td><div class="hc" style="background:var(--panel2);color:var(--tx3)">—</div></td>';
    });
    var ta=agg(byA[n]), tv=m.f(ta);
    h+='<td><div class="hc" style="background:var(--panel2);color:var(--tx2);font-weight:700">'+(tv==null?'—':m.fmt(tv))+'</div></td></tr>';
  });
  h+='</tbody></table>';
  $('#heatChart').innerHTML=h+'<div class="lg"><span><i style="background:rgb(224,45,60)"></i>较差</span><span><i style="background:rgb(245,158,11)"></i>中等</span><span><i style="background:rgb(14,159,110)"></i>较优</span><span style="color:var(--tx3)">仅显示 ≥3 场的主播</span></div>';
}

/* ==================== 星期 ==================== */
function renderWd(){
  var byW={}; VIEW.forEach(function(s){ (byW[s.wd]=byW[s.wd]||[]).push(s); });
  var W=1000,H=280,pl=56,pr=22,pt=20,pb=44, iw=W-pl-pr, ih=H-pt-pb;
  var arr=[]; for(var i=0;i<7;i++){ arr.push(byW[i]?agg(byW[i]):null); }
  var vals=arr.filter(function(a){return a;}).map(function(a){return a.lph||0;});
  if(!vals.length){ $('#wdChart').innerHTML='<div class="empty">无数据</div>'; return; }
  var mx=Math.max.apply(null,vals)*1.2||1;
  var bw=iw/7*0.56;
  var h='';
  for(var i=0;i<=4;i++){
    var y=pt+ih*i/4;
    h+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-dasharray="3 4"/>';
    h+='<text x="'+(pl-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--tx3)">'+fmt(mx-mx*i/4,2)+'</text>';
  }
  arr.forEach(function(a,i){
    var cx=pl+iw*(i+0.5)/7;
    h+='<text x="'+cx.toFixed(1)+'" y="'+(H-22)+'" text-anchor="middle" font-size="12" fill="var(--tx2)">'+WD[i]+'</text>';

/* ============ 客户端转换：飞书原始记录 → sessions/targets ============ */
/* 瘦 Worker 只把原始记录存 COS(records.json)，转换放在浏览器执行，规避 Cloudflare 免费档 10ms CPU 上限。
   逻辑与 scf_sync/index.py 一致；日期统一按北京时间解析。 */
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function cell(f, name) {
  var v = f[name];
  if (v === undefined) return null;
  if (Array.isArray(v)) return v.length ? v[0] : null;
  return v;
}
function num(v) {
  if (v === null || v === undefined || v === '') return null;
  var f = parseFloat(v);
  if (isNaN(f) || !isFinite(f)) return null;
  return f;
}
function hhmm(t) {
  if (!t || String(t).indexOf(':') < 0) return null;
  var p = String(t).trim().split(':');
  if (p.length < 2) return null;
  var h = parseInt(p[0], 10), m = parseInt(p[1], 10);
  if (isNaN(h) || isNaN(m)) return null;
  return h * 60 + m;
}
function bill(m) {
  if (!m || m <= 0) return null;
  return Math.ceil(m / 30.0) * 0.5;
}
function datePartsFromMs(ms) {
  var sec = ms > 1e11 ? ms / 1000 : ms;
  var utc = new Date(sec * 1000);
  var bj = new Date(utc.getTime() + 8 * 3600 * 1000);
  var Y = bj.getUTCFullYear(), M = bj.getUTCMonth() + 1, D = bj.getUTCDate();
  var dateStr = Y + '-' + pad2(M) + '-' + pad2(D);
  var wd = (bj.getUTCDay() + 6) % 7;
  var ts = Date.parse(dateStr + 'T00:00:00+08:00');
  return { dateStr: dateStr, wd: wd, ts: ts };
}
function parse_date(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'boolean') return null;
  if (typeof v === 'number') return datePartsFromMs(v);
  if (typeof v === 'string') {
    var s = v.trim();
    if (/^\\d{12,}$/.test(s)) return datePartsFromMs(Number(s));
    s = s.replace(/\\//g, '-').slice(0, 10);
    if (/^\\d{4}-\\d{2}-\\d{2}$/.test(s)) {
      var p = s.split('-');
      var Y = +p[0], M = +p[1] - 1, D = +p[2];
      var wd = (new Date(Date.UTC(Y, M, D)).getUTCDay() + 6) % 7;
      return { dateStr: s, wd: wd, ts: Date.parse(s + 'T00:00:00+08:00') };
    }
    return null;
  }
  return null;
}
function parse_ym(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'boolean') return null;
  if (typeof v === 'number') { var dt = parse_date(v); return dt ? dt.dateStr.slice(0, 7) : null; }
  var s = String(v).trim().replace(/\\//g, '-').slice(0, 7);
  return s.length === 7 ? s : null;
}
function bucket_of(s) {
  if (s === null || s === undefined) return '未知';
  var h = Math.floor(s / 60) % 24;
  if (6 <= h && h < 10) return '早间 06-10';
  if (10 <= h && h < 14) return '午间 10-14';
  if (14 <= h && h < 18) return '下午 14-18';
  if (18 <= h && h < 22) return '晚间 18-22';
  return '深夜 22-06';
}
function build_sessions(rows) {
  var out = [];
  for (var i = 0; i < rows.length; i++) {
    var f = rows[i].fields || {};
    var anchor = cell(f, '主播');
    var dt = parse_date(cell(f, '直播日期'));
    if (!dt || !anchor) continue;
    var d = dt.dateStr;
    var sm = hhmm(cell(f, '开播时间')), em = hhmm(cell(f, '下播时间'));
    var dm = null;
    if (sm !== null && em !== null) {
      dm = em - sm;
      if (dm < 0) dm += 24 * 60;
      if (!(0 < dm && dm <= 12 * 60)) dm = null;
    }
    if (dm === null) {
      var h = num(cell(f, '直播时长'));
      dm = (h && 0 < h && h <= 12) ? h * 60 : null;
    }
    var leads = num(cell(f, '留资数')) || 0;
    var cost = num(cell(f, '总消耗_元')) || 0;
    out.push({
      id: rows[i].record_id,
      sn: cell(f, '场次编号'),
      date: d,
      ts: dt.ts,
      ym: d.slice(0, 7),
      wd: dt.wd,
      anchor: anchor,
      atype: cell(f, '主播类型') || '未分类',
      team: cell(f, '团队归属') || '未分类',
      agent: cell(f, '代理') || '未分类',
      slot: cell(f, '场次属性') || '未知',
      st: cell(f, '开播时间'),
      et: cell(f, '下播时间'),
      bucket: bucket_of(sm),
      durMin: dm != null ? Math.round(dm * 10) / 10 : null,
      billH: bill(dm),
      cost: Math.round(cost * 100) / 100,
      leads: parseInt(leads, 10),
      views: parseInt(num(cell(f, '场观人数')) || 0, 10) || null,
      clicks: parseInt(num(cell(f, '小风车点击数')) || 0, 10) || null,
      comments: parseInt(num(cell(f, '评论数')) || 0, 10) || null,
      advice: cell(f, '投手建议'),
      backing: cell(f, '背贴')
    });
  }
  out.sort(function (a, b) {
    var c = a.date < b.date ? -1 : (a.date > b.date ? 1 : 0);
    if (c !== 0) return c;
    var sa = a.st || '', sb = b.st || '';
    return sa < sb ? -1 : (sa > sb ? 1 : 0);
  });
  return out;
}
function build_targets(rows) {
  var out = {};
  for (var i = 0; i < rows.length; i++) {
    var f = rows[i].fields || {};
    var ym_raw = cell(f, '月份'), anchor = cell(f, '主播'), tgt = num(cell(f, '月度目标'));
    var ym = parse_ym(ym_raw);
    if (!ym || !anchor || tgt === null) continue;
    var agent = cell(f, '所属代理') || '';
    if (agent && agent.indexOf('迈科') < 0) continue;
    if (!out[ym]) out[ym] = {};
    out[ym][anchor] = tgt;
  }
  return out;
}
function transformRaw(raw) {
  var sessions = build_sessions(raw.maike || []);
  var targets = build_targets(raw.target || []);
  var dates = sessions.map(function (s) { return s.date; });
  var meta = Object.assign({}, raw.meta || {});
  meta.total = sessions.length;
  meta.dateMin = dates.length ? dates.reduce(function (a, b) { return a < b ? a : b; }) : null;
  meta.dateMax = dates.length ? dates.reduce(function (a, b) { return a > b ? a : b; }) : null;
  meta.anchors = Array.from(new Set(sessions.map(function (s) { return s.anchor; }))).sort();
  meta.billingRule = 'ceil(分钟/30)×0.5';
  meta.notes = meta.notes || { noCity: '数据源无「获客城市」字段，城市维度暂不可用', noExposure: '「曝光人数」字段全表为空，曝光进入率不展示', sparseEarly: '小风车/评论/场观数据 2024 年缺失，2025 年起逐步完整' };
  return { meta: meta, sessions: sessions, targets: targets };
}
/* ============ 转换结束 ============ */

function boot(d){
  DATA=d; SESS=d.sessions||[];
  if(!SESS.length){ document.querySelector('.wrap').innerHTML='<div class="empty">数据为空</div>'; return; }
  $('#syncInfo').textContent='同步于 '+d.meta.syncedAt+'　·　'+fmt(d.meta.total)+' 场';
  initUI();
  // 默认近 90 天
  var b=new Date(d.meta.dateMax), a=new Date(b.getTime()-89*864e5);
  var lo=new Date(d.meta.dateMin);
  if(a<lo) a=lo;
  state.d1=a.toISOString().slice(0,10); state.d2=d.meta.dateMax;
  $('#d1').value=state.d1; $('#d2').value=state.d2;
  $('#d1').min=d.meta.dateMin; $('#d1').max=d.meta.dateMax;
  $('#d2').min=d.meta.dateMin; $('#d2').max=d.meta.dateMax;
  renderAll();
  $$('#quickRange .chip')[2].classList.add('on');
}

/* ==================== 启动：优先拉取 COS 最新数据，失败回退内联 ==================== */
window.COS_DATA_URL = window.COS_DATA_URL || 'data.json';
function initFromRaw(raw){
  var data = (raw && raw.maike) ? transformRaw(raw) : raw;
  if(data && data.sessions && data.sessions.length){
    boot(data);
    var m=data.meta||{};
    toast('已同步 ' + (m.syncedAt||'?') + ' · ' + (m.total||'?') + ' 场 · 最新 ' + (m.lastDate||m.dateMax||''));
  } else {
    document.querySelector('.wrap').innerHTML='<div class="empty">数据为空</div>';
  }
}
function showLoading(){
  var el=document.getElementById('syncInfo');
  if(el) el.textContent='数据加载中…';
}
function showLoadErr(msg){
  document.querySelector('.wrap').innerHTML='<div class="empty">数据加载失败：'+msg+'</div>';
}
function startLoad(){
  showLoading();
  fetch(window.COS_DATA_URL, {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){ window.__LAST_SYNC_AT = (d.meta&&d.meta.syncedAt)||''; initFromRaw(d); })
    .catch(function(e){
      console.warn('[load] COS 拉取失败，使用内联兜底数据：', e.message);
      if(window.__PRELOADED__){
        var fb = window.__PRELOADED__;
        window.__LAST_SYNC_AT = (fb.meta&&fb.meta.syncedAt)||'';
        var bel = document.getElementById('syncBadge');
        if(bel){ bel.textContent = '数据来源：内联兜底 · 同步于 ' + ((fb.meta&&fb.meta.syncedAt)||'?'); bel.style.display=''; }
        initFromRaw(fb);
      }
      else { showLoadErr(e.message); }
    });
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', startLoad);
} else {
  startLoad();
}
</script>
<script>
/* ==================== 自动同步：周期拉取 COS 最新数据 ==================== */
(function(){
  var SYNC_MS = window.SYNC_INTERVAL_MS || (15*60*1000);
  function badge(src, ts){
    var el = document.getElementById('syncBadge');
    if(el){ el.textContent = '数据来源：' + src + ' · 同步于 ' + (ts||'?'); el.style.display=''; }
  }
  function applyIfNewer(d){
    try {
      if(!d || !d.meta || !d.sessions || !d.sessions.length) return false;
      var remote = d.meta.syncedAt || '';
      var local = window.__LAST_SYNC_AT || '';
      if(local && remote && remote <= local) return false;
      window.__LAST_SYNC_AT = remote;
      try { localStorage.setItem('gz_data_cache', JSON.stringify(d)); } catch(e){}
      boot(d);
      badge('COS 实时', remote);
      return true;
    } catch(e){ console.warn('applyIfNewer fail', e); return false; }
  }
  async function pull(){
    try {
      var r = await fetch(window.COS_DATA_URL, {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      var d = await r.json();
      if(applyIfNewer(d)){ console.log('[sync] COS 数据已更新'); }
    } catch(e){ console.warn('[sync] COS 拉取失败', e.message); }
  }
  window.addEventListener('load', function(){
    pull();
    setInterval(pull, SYNC_MS);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) pull(); });
  });
})();
</script>
