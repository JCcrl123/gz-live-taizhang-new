name: 恢复最新UI

on:
  workflow_dispatch: {}      # 在 Actions 页面手动点一次即可

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库（完整历史，才能取到 4139c9e 的文件）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 从 git 历史恢复完整 index.html（主播分析V2 @ 4139c9e）
        run: |
          git checkout 4139c9e0691bf01b84b59c28ee8a250e7d318761 -- index.html
          echo "已恢复 index.html"
          wc -c index.html

      - name: 修复 index.html 中已知的正则损坏
        run: |
          if grep -q 'replace(/\\/ / g,' index.html; then
            sed -i 's|replace(/\\/ / g,|replace(/\\/g,|g' index.html
            echo 'FIXED: 已修复 /\\\\/ / g -> /\\\\/g'
            grep -n 'replace(/\\/g,' index.html || true
          else
            echo 'OK: 未发现正则损坏'
          fi

      - name: 运行同步脚本（直连飞书，生成 data.json）
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_AUTH_MODE: ${{ secrets.FEISHU_AUTH_MODE || 'tenant' }}
          FEISHU_REFRESH_TOKEN: ${{ secrets.FEISHU_REFRESH_TOKEN }}
        run: python scripts/sync_data.py

      - name: 注入最新数据到 index.html
        run: python scripts/inject_preload.py

      - name: 验证 index.html 完整性（防止空白页）
        run: |
          python - <<'PY'
          import json, re, sys
          with open('index.html', 'r', encoding='utf-8') as f:
              html = f.read()
          m = re.search(r'window\.__PRELOADED__\s*=\s*', html)
          if not m:
              print('ERROR: 找不到 window.__PRELOADED__')
              sys.exit(1)
          data, _ = json.JSONDecoder().raw_decode(html, m.end())
          sessions = data.get('sessions', [])
          raw_records = data.get('maike', [])
          total = data.get('meta', {}).get('total', 0)
          synced_at = data.get('meta', {}).get('syncedAt', '-')
          print('验证通过: sessions=%d, raw=%d, total=%d, syncedAt=%s' % (
              len(sessions), len(raw_records), total, synced_at
          ))
          if sessions and len(sessions) < 500:
              print('ERROR: sessions 数量异常（%d < 500），拒绝提交' % len(sessions))
              sys.exit(1)
          if raw_records and len(raw_records) < 500:
              print('ERROR: maike 原始记录数异常（%d < 500），拒绝提交' % len(raw_records))
              sys.exit(1)
          if not sessions and not raw_records:
              print('ERROR: 既没有 sessions 也没有 maike，拒绝提交')
              sys.exit(1)
          # 关键检查：JSON 字符串内的 </script> 必须已被转义
          _, json_end = json.JSONDecoder().raw_decode(html, m.end())
          json_text = html[m.end():json_end]
          if '</script>' in json_text.lower():
              print('ERROR: __PRELOADED__ JSON 内存在未转义的 </script>')
              sys.exit(1)
          # 检查正则是否被错误拆坏
          if 'replace(/\\/ / g,' in html:
              print('ERROR: index.html 中存在被拆坏的正则，会导致 g is not defined')
              sys.exit(1)
          print('OK: 验证全部通过')
          PY

      - name: 提交并推回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 恢复主播分析V2 UI 并注入最新飞书数据"
            git push
          fi
